name: Deploy design.mari.guru

# Publishes the component-library preview to https://design.mari.guru/
# (S3 origin + CloudFront w/ ACM TLS). Auth is via GitHub OIDC — no
# long-lived AWS keys are stored in the repo.

on:
  push:
    branches: [main]
    paths:
      - "components/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-design-site
  cancel-in-progress: true

permissions:
  id-token: write   # required for OIDC
  contents: read

env:
  AWS_REGION: us-east-1
  S3_BUCKET: design.mari.guru

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: components/package-lock.json

      - name: Install dependencies
        working-directory: components
        run: npm ci

      - name: Build static site
        working-directory: components
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        working-directory: components
        run: |
          # Long-cache the fingerprinted assets, no-cache the HTML entry.
          aws s3 sync dist "s3://${S3_BUCKET}" --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/index.html "s3://${S3_BUCKET}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
